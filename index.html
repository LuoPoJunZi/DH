<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="LUOPO Tools 提供简洁、快速、注重隐私的浏览器本地工具。" />
    <meta name="keywords" content="在线工具,JSON格式化,Base64,URL编码,文本工具,开发工具" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LUOPO Tools" />
    <meta property="og:title" content="LUOPO Tools" />
    <meta property="og:description" content="简洁、快速、注重隐私的浏览器本地工具集合。" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://tool.luopojunzi.com/" />
    <script>
      (() => {
        const stored = localStorage.getItem('luopo-theme') || 'system';
        const dark =
          stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>LUOPO Tools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
